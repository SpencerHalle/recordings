{% extends "base.html" %}
{% block title %}Sign in — Recordings{% endblock %}
{% block content %}
<section class="pane narrow">
  <h1>Sign in</h1>
  {% if bad %}<p class="err">Wrong password.</p>{% endif %}
  <form method="post" action="/login">
    <label>Password
      <input type="password" name="password" autocomplete="current-password"
             autofocus required>
    </label>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
